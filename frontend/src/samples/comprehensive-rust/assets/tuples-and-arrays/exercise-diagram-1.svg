<svg class="svgbob" height="64" width="272" xmlns="http://www.w3.org/2000/svg"><style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {  stroke: var(--fg, black);  stroke-width: 2;  stroke-opacity: 1;  fill-opacity: 1;  stroke-linecap: round;  stroke-linejoin: miter;}.svgbob text {  white-space: pre;  fill: var(--fg, black);  font-family: Iosevka Fixed, monospace;  font-size: 14px;}.svgbob rect.backdrop {  stroke: none;  fill: transparent;}.svgbob .broken {  stroke-dasharray: 8;}.svgbob .filled {  fill: black;}.svgbob .bg_filled {  fill: transparent;  stroke-width: 1;}.svgbob .nofill {  fill: transparent;}.svgbob .end_marked_arrow {  marker-end: url(#arrow);}.svgbob .start_marked_arrow {  marker-start: url(#arrow);}.svgbob .end_marked_diamond {  marker-end: url(#diamond);}.svgbob .start_marked_diamond {  marker-start: url(#diamond);}.svgbob .end_marked_circle {  marker-end: url(#circle);}.svgbob .start_marked_circle {  marker-start: url(#circle);}.svgbob .end_marked_open_circle {  marker-end: url(#open_circle);}.svgbob .start_marked_open_circle {  marker-start: url(#open_circle);}.svgbob .end_marked_big_open_circle {  marker-end: url(#big_open_circle);}.svgbob .start_marked_big_open_circle {  marker-start: url(#big_open_circle);}</style><defs><marker id="arrow" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="4" refy="2" viewbox="-2 -2 8 8"><polygon points="0,0 0,4 4,2 0,0"></polygon></marker><marker id="diamond" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="4" refy="2" viewbox="-2 -2 8 8"><polygon points="0,2 2,0 4,2 2,4 0,2"></polygon></marker><marker id="circle" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="4" refy="4" viewbox="0 0 8 8"><circle class="filled" cx="4" cy="4" r="2"></circle></marker><marker id="open_circle" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="4" refy="4" viewbox="0 0 8 8"><circle class="bg_filled" cx="4" cy="4" r="2"></circle></marker><marker id="big_open_circle" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="4" refy="4" viewbox="0 0 8 8"><circle class="bg_filled" cx="4" cy="4" r="3"></circle></marker></defs><rect class="backdrop" height="64" width="272" x="0" y="0"></rect><text x="122" y="12">2</text><text x="122" y="28">5</text><text x="122" y="44">8</text><text x="234" y="12">4</text><text x="234" y="28">5</text><text x="234" y="44">6</text><text x="250" y="12">7⎤</text><text x="250" y="28">8⎥</text><text x="250" y="44">9⎦</text><text x="2" y="28">transpose</text><text x="178" y="28">==</text><g><text x="90" y="12">⎛</text><text x="98" y="12">⎡</text><text x="106" y="12">1</text></g><g><text x="90" y="28">⎜</text><text x="98" y="28">⎢</text><text x="106" y="28">4</text></g><g><text x="90" y="44">⎝</text><text x="98" y="44">⎣</text><text x="106" y="44">7</text></g><g><text x="138" y="12">3⎤</text><text x="154" y="12">⎞</text></g><g><text x="138" y="28">6⎥</text><text x="154" y="28">⎟</text></g><g><text x="138" y="44">9⎦</text><text x="154" y="44">⎠</text></g><g><text x="210" y="12">⎡</text><text x="218" y="12">1</text></g><g><text x="210" y="28">⎢</text><text x="218" y="28">2</text></g><g><text x="210" y="44">⎣</text><text x="218" y="44">3</text></g></svg>
