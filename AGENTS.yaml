# Machine-readable companion to AGENTS.md: component graph, commands, policies.
# Never put secret values here - only file paths and environment KEY NAMES.
# Quote every date/version ('2026-11-22', '1.0') so YAML does not convert its type.
# After editing, run: scripts/check-agents-yaml.sh
schema_version: '1.0'

meta:
  name: dok3search
  description: 'Air-gapped document and code search monorepo (React frontend + Rust Cargo workspace)'
  owner: LeeYudok
  updated: '2026-11-23'
  repo_url: 'https://github.com/LeeYudok/dok3search'
  tracker: github
  issue_tracker_url: 'https://github.com/LeeYudok/dok3search/issues'

x-design_repo:
  name: dok3search-design
  repo_url: 'https://github.com/LeeYudok/dok3search-design'

environments:
  local:
    toolchain:
      rust: 'stable (backend/rust/rust-toolchain.toml)'
      node: 'npm (frontend/package-lock.json)'
  ci: 'github-actions (required-checks)'

nodes:
- {id: frontend, type: vite-react-app, label: 'React + TypeScript + Vite web UI', path: frontend/src/main.tsx, module: frontend/package.json}
- {id: comprehensive_rust, type: markdown-corpus, label: 'Comprehensive Rust Korean offline Markdown (guide/rust)', path: frontend/src/samples/comprehensive-rust/chapters}
- {id: rust_book, type: markdown-corpus, label: 'Official Rust Book English offline Markdown (guide/rust)', path: frontend/src/samples/rust-book/chapters}
- {id: rust_reference, type: markdown-corpus, label: 'Rust Reference English offline Markdown (guide/rust)', path: frontend/src/samples/rust-reference/chapters}
- {id: cargo_book, type: markdown-corpus, label: 'Cargo Book English offline Markdown (guide/rust)', path: frontend/src/samples/cargo-book/chapters}
- {id: rust_std, type: markdown-corpus, label: 'Rust std/core/alloc rustdoc offline Markdown (code/rust)', path: frontend/src/samples/rust-std/chapters}
- {id: rust_crates, type: markdown-corpus, label: 'Workspace and used direct dependency crates rustdoc Markdown (code/rust)', path: frontend/src/samples/rust-crates/chapters}
- {id: rustc_error_codes, type: markdown-corpus, label: 'Rust compiler error index from rustc --explain (code/rust)', path: frontend/src/samples/rustc-error-codes/chapters}
- {id: go_reference, type: markdown-corpus, label: 'Go official reference and Korean and English practice guides (guide/go)', path: frontend/src/samples/go-reference/chapters}
- {id: comprehensive_rust_importer, type: script, label: 'Convert local mdBook snapshots to Markdown', path: scripts/import-comprehensive-rust.py}
- {id: rust_official_importer, type: script, label: 'Convert installed Rust Reference and Cargo Book docs to offline Markdown', path: scripts/import-rust-official-components.py}
- {id: rustdoc_error_importer, type: script, label: 'Convert local rustdoc (std + used crates) and rustc --explain to offline Markdown', path: scripts/import-rustdoc-and-errors.py}
- {id: rust_workspace, type: cargo-workspace, label: 'Rust backend Cargo workspace', path: backend/rust/Cargo.toml}
- {id: dok3_server, type: rust-binary, label: 'Single server binary entrypoint (dok3search)', path: backend/rust/crates/dok3-server/src/main.rs}
- {id: dok3_api, type: rust-crate, label: 'Axum HTTP router, security headers, static SPA fallback', path: backend/rust/crates/dok3-api/src/lib.rs}
- {id: dok3_agent, type: rust-crate, label: 'Agent protocol adapters (MCP, A2A, ACP)', path: backend/rust/crates/dok3-agent/src/lib.rs}
- {id: dok3_search, type: rust-crate, label: 'Search orchestration, ACL enforcement, in-memory store', path: backend/rust/crates/dok3-search/src/lib.rs}
- {id: dok3_index_manager, type: rust-crate, label: 'Blue-green generation build, activation, recovery', path: backend/rust/crates/dok3-index-manager/src/lib.rs}
- {id: dok3_index, type: rust-crate, label: 'Tantivy schema, writer, reader management', path: backend/rust/crates/dok3-index/src/lib.rs}
- {id: dok3_storage, type: rust-crate, label: 'SQLite change journal, metadata, active generation state', path: backend/rust/crates/dok3-storage/src/lib.rs}
- {id: dok3_domain, type: rust-crate, label: 'Core domain types, ACL model, and port traits', path: backend/rust/crates/dok3-domain/src/lib.rs}
- {id: dok3_core, type: rust-crate, label: 'Shared errors, runtime config, common primitives', path: backend/rust/crates/dok3-core/src/lib.rs}
- {id: dok3_parser, type: rust-crate, label: 'Document and code parsers', path: backend/rust/crates/dok3-parser/src/lib.rs}
- {id: dok3_analyzer, type: rust-crate, label: 'Korean, English, n-gram, identifier analyzers', path: backend/rust/crates/dok3-analyzer/src/lib.rs}
- {id: dok3_connectors, type: rust-crate, label: 'File, Git, SVN, DB source connectors', path: backend/rust/crates/dok3-connectors/src/lib.rs}
- {id: dok3_benchmark, type: rust-crate, label: 'Reproducible indexing and search load benchmarks', path: backend/rust/crates/dok3-benchmark/src/lib.rs}
- {id: manual_doc, type: markdown-doc, label: 'Self-operating manual Knowledge Pack', path: docs/manual/dok3search-manual.md}
- {id: deploy_dockerfile, type: dockerfile, label: 'Multi-stage linux/amd64 image build (SPA + Rust server + knowledge corpus)', path: Dockerfile}
- {id: doksam_deploy_manifest, type: k8s-manifest, label: 'doksam k3s Namespace/PVC/Deployment/Service + Traefik basicAuth Ingress', path: deploy/doksam/k3s/dok3search.yaml}
- {id: doksam_deploy_scripts, type: script, label: 'doksam build/smoke/import/deploy/rollback/verify scripts (commit-SHA tags, basicAuth Secret)', path: deploy/doksam/scripts/deploy.sh}
- {id: doksam_deploy_readme, type: markdown-doc, label: 'doksam deployment, basicAuth, rollback rehearsal and verification manual', path: deploy/doksam/README.md}

