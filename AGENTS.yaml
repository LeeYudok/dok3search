ports:
- {id: dok3_server_http, port: 8080, protocol: http, note: 'Default local dev HTTP bind (127.0.0.1); override with DOK3_PORT'}

env_keys:
  dok3_server: [DOK3_BIND, DOK3_PORT, DOK3_DATA_DIR, DOK3_STATIC_DIR, DOK3_DESIGN_DIR, DOK3_SOURCE_DIR, DOK3_REFRESH_INTERVAL_SECS, DOK3_ENABLE_ADMIN, DOK3_ALLOW_NON_LOOPBACK_BIND]

commands:
  frontend:
    install: 'npm --prefix frontend ci'
    dev: 'npm --prefix frontend run dev'
    build: 'npm --prefix frontend run build'
  rust:
    run: 'cargo run --manifest-path backend/rust/Cargo.toml -p dok3-server'
    fmt: 'cargo fmt --manifest-path backend/rust/Cargo.toml --all -- --check'
    clippy: 'cargo clippy --manifest-path backend/rust/Cargo.toml --workspace --all-targets -- -D warnings'
    test: 'cargo test --manifest-path backend/rust/Cargo.toml --workspace'
    build: 'cargo build --manifest-path backend/rust/Cargo.toml --workspace'
  reference_corpora:
    import_comprehensive_rust: 'python3 scripts/import-comprehensive-rust.py <snapshot-dir> <output-dir>'
    import_official_rust: "python3 scripts/import-rust-official-components.py --rust-docs-root <toolchain>/share/doc/rust/html --license-root <toolchain>/share/doc/rust/licenses --output-root frontend/src/samples --version '<rustc version>'"
    import_rustdoc_and_errors: 'python3 scripts/import-rustdoc-and-errors.py --output-root frontend/src/samples'
  checks:
    agents_yaml: scripts/check-agents-yaml.sh
    design_copy: 'python3 scripts/check-design-copy.py'
  deploy:
    image_build: 'deploy/doksam/scripts/build-image.sh'
    basic_auth_secret: 'deploy/doksam/scripts/create-basic-auth-secret.sh'
    smoke_container: 'deploy/doksam/scripts/smoke-container.sh'
    deploy: 'deploy/doksam/scripts/deploy.sh'
    rollback: 'deploy/doksam/scripts/rollback.sh'
    verify: 'deploy/doksam/scripts/verify.sh'

policies:
- {id: agents_yaml_sync, rule: 'Update AGENTS.md and AGENTS.yaml together when components, paths, commands or env keys change; run scripts/check-agents-yaml.sh', source: AGENTS.md}
- {id: dependency_direction, rule: 'Keep dok3-domain free of external crate implementations; prevent dok3-parser from depending on dok3-index; route API and agent calls through dok3-search', source: AGENTS.md}
- {id: airgap_no_external_navigation, rule: 'Render external Markdown URLs as non-clickable offline citations; only local documents, sections and bundled license files may navigate', source: AGENTS.md}
- {id: auto_merge, rule: 'Require cross-agent review and required CI checks; the current conductor may immediately merge with --merge only when both pass; prohibit squash merges', source: AGENTS.md}
- {id: public_exposure_basic_auth, rule: 'Wrap the whole doksam Ingress in a Traefik basicAuth middleware so an unauthenticated direct Host request returns 401; bind the container on 0.0.0.0:8080 behind a ClusterIP Service and never reuse jex3 host ports', source: deploy/doksam/README.md}
- {id: secret_no_plaintext, rule: 'Never commit basicAuth credentials or pass them in sudo/curl argv; generate them only as a Kubernetes Secret and mode-0600 files on the doksam runtime with openssl and SUDO_PASS read from runtime env/stdin, and record just paths and key names', source: deploy/doksam/README.md}

secret_files:
- {host: doksam, path: /etc/dok3search/basic-auth.pass, keys: ['plaintext basicAuth password'], used_by: deploy/doksam/scripts/create-basic-auth-secret.sh}
- {host: doksam, path: /etc/dok3search/basic-auth.users, keys: ['htpasswd users line'], used_by: deploy/doksam/scripts/basic-auth-remote.sh}

secret_facts:
- {id: doksam_basic_auth_secret, namespace: dok3search, secret: dok3search-basic-auth, key: users, note: 'Traefik basicAuth htpasswd; generated by deploy/doksam/scripts/create-basic-auth-secret.sh, never committed'}

known_issues: []

